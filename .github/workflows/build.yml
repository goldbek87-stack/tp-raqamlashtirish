name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketlarni o'rnatish
        run: npm install

      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx cap sync android

      - name: Ruxsatlar (kamera, GPS, internet)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application#' $M
          grep -n "permission" $M

      - name: APK yig'ish
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK ni yuklab olishga qo'yish
        uses: actions/upload-artifact@v4
        with:
          name: TP-raqamlashtirish-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
